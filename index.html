<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Bot Martingale Pro</title>
    <style>
        :root { --blue: #3b82f6; --red: #ef4444; --green: #10b981; --bg: #0a0f1d; }
        body { background: var(--bg); color: white; font-family: sans-serif; padding: 15px; text-align: center; }
        .card { background: #161d2f; padding: 20px; border-radius: 20px; border: 1px solid #1e293b; margin-bottom: 15px; }
        .martingale-box { display: flex; flex-direction: column; gap: 10px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--blue); background: #0a0f1d; color: white; box-sizing: border-box; font-size: 18px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; }
        .btn-win { background: var(--green); }
        .btn-loss { background: var(--red); }
        .result-text { margin-top: 15px; font-size: 16px; font-weight: bold; border-top: 1px solid #1e293b; padding-top: 10px; }
    </style>
</head>
<body>

    <div style="font-size: 20px; font-weight: bold; margin-bottom: 15px;">📊 СТРАТЕГИЯИ МАРТИНГЕЙЛ</div>

    <div class="card">
        <div class="martingale-box">
            <label style="font-size: 12px; color: #94a3b8; margin-bottom: 5px;">СТАВКАИ АВВАЛИН (TJS):</label>
            <input type="number" id="baseBet" value="2">
            
            <div class="btn-group">
                <button class="btn btn-win" onclick="handleWin()">БУРД ✅</button>
                <button class="btn btn-loss" onclick="handleLoss()">БОХТ ❌</button>
            </div>
        </div>

        <div id="martingaleRes" class="result-text">
            Ставкаи ҳозира: <span id="currentBet" style="color: var(--blue);">2</span> TJS
        </div>
    </div>

    <script>
        let currentBet = 2;

        function handleWin() {
            // Баъд аз бурд ба ставкаи аввалин бармегардем
            currentBet = parseFloat(document.getElementById('baseBet').value);
            updateUI("✅ Бурд! Ба ставкаи аввал баргардед.");
        }

        function handleLoss() {
            // Баъд аз бохт ставкаро 3 баробар зиёд мекунем
            currentBet = currentBet * 3;
            updateUI("❌ Бохт! Ставкаро зиёд кунед.");
        }

        function updateUI(msg) {
            document.getElementById('currentBet').innerText = currentBet.toFixed(2);
            let resBox = document.getElementById('martingaleRes');
            resBox.innerHTML = `Ставкаи навбатӣ: <span style="color: var(--blue);">${currentBet.toFixed(2)}</span> TJS<br><small>${msg}</small>`;
        }
    </script>
</body>
</html>
